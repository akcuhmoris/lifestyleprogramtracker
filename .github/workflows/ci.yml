name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
        # The web app's eslint config flags type errors too via next/core-web-vitals.

      - name: Test
        run: npm test

      - name: Build (web)
        run: npm run build
        env:
          # CI uses dummy values where real ones don't exist yet.
          # Replace these with real secrets once Supabase is set up.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
